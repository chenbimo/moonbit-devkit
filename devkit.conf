# 全局默认:唯一源自己的配置,只放与具体项目无关的常量。
# 项目级的业务声明在各仓库的 scripts/devkit.conf。

# MoonBit 工具链版本(取自 WSL 的 `moonc -v`)。
# CI 与本地 WSL 必须一致,这里改一处,所有项目的 CI 跟着变。
MOONC_VERSION="0.10.18+6c83a7f62"

# 默认集合排除名单(空格分隔):非模块项目(如门户站点)不进 sync/check/audit 的默认范围,
# 显式点名仍可操作(audit site)。新模块直接新增白名单,不动 defs 逻辑。
# 抹名时仓库名即目录名;唯一源 scripts 自身不在名单也默认排除。
DEVKIT_EXCLUDE="site"
